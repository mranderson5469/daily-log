<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="description" content="Margaret's daily log of meds, food, symptoms, blood pressure and bathroom.">
<title>Margaret's Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<header class="top">
  <button class="navbtn" id="dayPrev" aria-label="Previous day">‹</button>
  <div class="daytitle"><div id="dayLabel"></div><div id="daySub" class="sub"></div></div>
  <button class="navbtn" id="dayNext" aria-label="Next day">›</button>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" class="on"><span aria-hidden="true">🏠</span>Today</button>
  <button data-tab="week"><span aria-hidden="true">📈</span>Week</button>
  <button data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
</nav>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="x" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js?v=4"></script>
</body>
</html>
